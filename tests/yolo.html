<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Argus tests — yolo.js sanity</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 16px;
        background: #0f1115;
        color: #e8eaed;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      header { margin-bottom: 12px; }
      header h1 { margin: 0 0 4px; font-size: 1.1rem; }
      header p { margin: 0; color: #9aa0a6; font-size: 0.85rem; }
      .drop {
        border: 2px dashed #2a3140;
        border-radius: 8px;
        padding: 32px;
        text-align: center;
        color: #9aa0a6;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .drop.hot { border-color: #22d3ee; color: #22d3ee; }
      .stage {
        position: relative;
        display: inline-block;
        max-width: 100%;
      }
      .stage img,
      .stage canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      pre {
        background: #161a22;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        overflow: auto;
        max-height: 30vh;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        margin: 8px 0;
        color: #9aa0a6;
      }
      .meta b { color: #e8eaed; font-weight: 600; }
      label.classes {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        color: #9aa0a6;
      }
      input[type="text"] {
        background: #161a22;
        color: #e8eaed;
        border: 1px solid #2a3140;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>yolo.js sanity test</h1>
      <p>Drop an image to run a one-shot detection through the same pipeline as the live app. No tracker, no webcam — just preprocess → ORT → NMS.</p>
    </header>

    <label class="classes">
      class filter (comma separated, blank = all 80):
      <input id="classes" type="text" placeholder="0" value="0">
    </label>

    <div id="drop" class="drop">drop an image here, or click to pick</div>
    <input id="file" type="file" accept="image/*" hidden>

    <div class="stage">
      <img id="preview" alt="">
      <canvas id="overlay"></canvas>
    </div>

    <div class="meta">
      <span>backend: <b id="m-backend">—</b></span> &nbsp;
      <span>detect: <b id="m-ms">—</b> ms</span> &nbsp;
      <span>detections: <b id="m-count">—</b></span>
    </div>

    <pre id="json">[]</pre>

    <script type="module">
      import { YoloDetector } from '/src/detector/yolo.js';

      const drop = document.getElementById('drop');
      const fileInput = document.getElementById('file');
      const preview = document.getElementById('preview');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const classesEl = document.getElementById('classes');
      const mBackend = document.getElementById('m-backend');
      const mMs = document.getElementById('m-ms');
      const mCount = document.getElementById('m-count');
      const jsonEl = document.getElementById('json');

      let detector = null;

      function parseClassFilter() {
        const raw = classesEl.value.trim();
        if (!raw) return undefined;
        const ids = raw.split(',').map((s) => parseInt(s.trim(), 10)).filter((n) => !Number.isNaN(n));
        return ids.length ? ids : undefined;
      }

      async function ensureDetector() {
        if (detector) return detector;
        detector = new YoloDetector('/models/yolo11n.onnx', { classFilter: parseClassFilter() });
        await detector.init();
        mBackend.textContent = detector.backend;
        return detector;
      }

      function drawDetections(dets) {
        canvas.width = preview.naturalWidth;
        canvas.height = preview.naturalHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = Math.max(2, Math.round(canvas.width / 480));
        ctx.font = `${Math.max(12, Math.round(canvas.width / 60))}px ui-monospace, monospace`;
        ctx.textBaseline = 'top';
        ctx.strokeStyle = '#22d3ee';
        for (const d of dets) {
          ctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);
          const label = `c${d.classId} ${(d.score * 100).toFixed(0)}%`;
          const m = ctx.measureText(label);
          ctx.fillStyle = 'rgba(34,211,238,0.85)';
          ctx.fillRect(d.x1, Math.max(0, d.y1 - 18), m.width + 8, 18);
          ctx.fillStyle = '#0f1115';
          ctx.fillText(label, d.x1 + 4, Math.max(0, d.y1 - 18) + 2);
        }
      }

      async function runOn(file) {
        const url = URL.createObjectURL(file);
        preview.src = url;
        await preview.decode();
        const det = await ensureDetector();
        det.classFilter = parseClassFilter() ?? det.classFilter;
        const { detections, detectMs } = await det.infer(preview);
        mMs.textContent = detectMs.toFixed(1);
        mCount.textContent = String(detections.length);
        jsonEl.textContent = JSON.stringify(detections, null, 2);
        drawDetections(detections);
      }

      drop.addEventListener('click', () => fileInput.click());
      drop.addEventListener('dragover', (e) => {
        e.preventDefault();
        drop.classList.add('hot');
      });
      drop.addEventListener('dragleave', () => drop.classList.remove('hot'));
      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        drop.classList.remove('hot');
        const f = e.dataTransfer?.files?.[0];
        if (f) runOn(f).catch((err) => alert(err.message ?? err));
      });
      fileInput.addEventListener('change', () => {
        const f = fileInput.files?.[0];
        if (f) runOn(f).catch((err) => alert(err.message ?? err));
      });
    </script>
  </body>
</html>
