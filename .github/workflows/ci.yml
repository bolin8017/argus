name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download YOLO weights (CI only)
        run: npm run model:fetch

      - name: Check vendored runtimes
        run: |
          test -f vendor/ort/ort.webgpu.bundle.min.mjs
          test -f vendor/ort/ort-wasm-simd-threaded.asyncify.wasm
          test -f vendor/human/human.esm.js
          test -f vendor/human/tfjs-wasm/tfjs-backend-wasm.wasm
          test -f models/human/blazeface.json
          test -f models/human/blazeface.bin
          test -f models/yolo11n.onnx
